# Render Blueprint: one Node web service runs the Colyseus server and serves the built client.
# On render.com: New > Blueprint, pick this repo, Apply.
services:
  - type: web
    name: speed-fish-escape
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
